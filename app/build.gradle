plugins {
    id 'com.android.application'
}

android {
    namespace 'it.leggero.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'it.leggero.launcher'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Firmato con la chiave di debug cosi' l'APK release si installa subito via adb
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
